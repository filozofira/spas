services:
  # Transformation Middleware (sits between DAPR sidecar and service)
  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    ports:
      - "8080:8080"
    networks:
      - dapr-test
    depends_on:
      - spas-service
    environment:
      - SERVICE_URL=http://spas-service:8081

  # The SPAS Service (app)
  spas-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "8081:8081"
    environment:
      - DAPR_HOST=localhost
      - DAPR_HTTP_PORT=3500
    networks:
      - dapr-test

  # DAPR Sidecar for the SPAS Service
  # IMPORTANT: DAPR is configured to call middleware on port 8080, not direct to service
  dapr-sidecar:
    image: daprio/daprd:latest
    command: >
      ./daprd
      -app-id spas-service
      -app-port 8080
      -dapr-http-port 3500
      -dapr-grpc-port 50001
      -components-path /dapr/components
      -log-level debug
    ports:
      - "3500:3500"
      - "50001:50001"
    volumes:
      - ./dapr/components:/dapr/components
    networks:
      - dapr-test
    depends_on:
      - middleware

  # Publisher service to send test events
  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    networks:
      - dapr-test
    depends_on:
      dapr-sidecar:
        condition: service_started
    command: sh -c "sleep 4 && ./publisher"

networks:
  dapr-test:
    driver: bridge
