# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: order-fulfillment

# Named choreography flows
# Use /spas.compose agent to generate flows based on service contracts
flows:
  order-fulfillment-flow:
    description: "Complete order fulfillment from creation through delivery"
    participants:
      - order-service
      - inventory-service
      - fulfillment-service
    events:
      # Step 1: Order created → Reserve stock
      - source: order-service
        event: order-created
        topic: order-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-order-created.jsonata
      
      # Step 2: Stock reserved → Confirm order
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets:
          - service: order-service
            command: confirm-order
            transform: transformations/order-service/inbound-stock-reserved.jsonata
      
      # Step 3: Order confirmed → Create shipment
      - source: order-service
        event: order-confirmed
        topic: order-events
        targets:
          - service: fulfillment-service
            command: create-shipment
            transform: transformations/fulfillment-service/inbound-order-confirmed.jsonata
      
      # Step 4: Shipment created → Update order tracking
      - source: fulfillment-service
        event: shipment-created
        topic: fulfillment-events
        targets:
          - service: order-service
            command: update-shipment-status
            transform: transformations/order-service/inbound-shipment-created.jsonata
      
      # Step 5: Shipment status changed → Update order tracking
      - source: fulfillment-service
        event: shipment-status-changed
        topic: fulfillment-events
        targets:
          - service: order-service
            command: update-shipment-status
            transform: transformations/order-service/inbound-shipment-status-changed.jsonata
      
      # Terminal events (published but no consumers in this choreography)
      - source: order-service
        event: order-cancelled
        topic: order-events
        targets: []
      
      - source: inventory-service
        event: stock-depleted
        topic: inventory-events
        targets: []
      
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []
      
      - source: inventory-service
        event: inventory-item-added
        topic: inventory-events
        targets: []

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
