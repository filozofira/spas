services:
  # Redis backend
  redis:
    image: redis:6-alpine
    container_name: dapr-output-binding-redis
    ports:
      - "6379:6379"
    networks:
      - dapr-network

  # Publisher Service
  publisher:
    build: ./publisher
    container_name: dapr-output-binding-publisher
    networks:
      - dapr-network

  # Publisher Transformer Sidecar
  publisher-transformer-sidecar:
    build: ./transformer-sidecar
    container_name: publisher-transformer-sidecar
    environment:
      - PORT=7001
      - CONFIG_PATH=/app/config.publisher.json
    volumes:
      - ./transformer-sidecar/config.publisher.json:/app/config.publisher.json
    depends_on:
      - redis
    networks:
      - dapr-network


  # Subscriber Service
  subscriber:
    build: ./subscriber
    container_name: dapr-output-binding-subscriber
    ports:
      - "6000:6000"
    networks:
      - dapr-network

  # Subscriber Transformer Sidecar
  subscriber-transformer-sidecar:
    build: ./transformer-sidecar
    container_name: subscriber-transformer-sidecar
    environment:
      - PORT=7002
      - CONFIG_PATH=/app/config.subscriber.json
    volumes:
      - ./transformer-sidecar/config.subscriber.json:/app/config.subscriber.json
    depends_on:
      - redis
    networks:
      - dapr-network

networks:
  dapr-network:
    driver: bridge
