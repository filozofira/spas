# NOTE: Manually updated to use images instead of build (see FG05)

services:
  redis:
    image: redis:7-alpine
    container_name: spas-redis
    ports:
      - "6379:6379"
    networks:
      - spas-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 3
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: spas-zipkin
    ports:
      - "9411:9411"
    networks:
      - spas-network
  inventory-service:
    image: spas-examples/inventory-service:1.0.0
    container_name: spas-inventory-service
    ports:
      - "5001:8080"
    environment:
      - SERVICE_NAME=inventory-service
      - SIDECAR_PORT=7001
      - PORT=8080
      - ZIPKIN_URL=http://zipkin:9411
    networks:
      - spas-network
  inventory-service-sidecar:
    image: spas/sidecar:latest
    container_name: inventory-service-sidecar
    environment:
      - PORT=7001
      - CONFIG_PATH=/app/config.json
      - SERVICE_NAME=inventory-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config.inventory-service.json:/app/config.json
      - ./transformations/inventory-service:/app/transformations
    networks:
      - spas-network
    depends_on:
      - redis
      - zipkin
  order-service:
    image: spas-examples/order-service:1.0.0
    container_name: spas-order-service
    ports:
      - "5002:8080"
    environment:
      - SERVICE_NAME=order-service
      - SIDECAR_PORT=7002
      - PORT=8080
      - ZIPKIN_URL=http://zipkin:9411
    networks:
      - spas-network
  order-service-sidecar:
    image: spas/sidecar:latest
    container_name: order-service-sidecar
    environment:
      - PORT=7002
      - CONFIG_PATH=/app/config.json
      - SERVICE_NAME=order-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config.order-service.json:/app/config.json
    networks:
      - spas-network
    depends_on:
      - redis
      - zipkin
networks:
  spas-network:
    driver: bridge
