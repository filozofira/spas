version: "3.8"

services:
  # SPAS Repository Service
  spas-repository:
    build:
      context: ..
      dockerfile: repository/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - STORAGE_PROVIDER=sqlite
      - SQLITE_PATH=/app/data/repository.db
      - SPAS_SCHEMA_PATH=/app/schemas/design-time-metadata-v1.schema.json
    volumes:
      - repository-data:/app/data
      - ./src:/app/repository/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - spas-network

volumes:
  repository-data:
    driver: local

networks:
  spas-network:
    driver: bridge
