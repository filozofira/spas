services:
  # Redis backend
  redis:
    image: redis:6-alpine
    container_name: spas-redis
    ports:
      - "6379:6379"
    networks:
      - spas-network

  # Zipkin for distributed tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: spas-zipkin
    ports:
      - "9411:9411"
    networks:
      - spas-network

  # Order Service
  order-service:
    build: ./order-service
    container_name: spas-order-service
    ports:
      - "5001:5001"
    environment:
      - SERVICE_NAME=order-service
      - SIDECAR_PORT=7001
      - PORT=5001
    networks:
      - spas-network

  # Order Service SPAS Sidecar
  order-service-sidecar:
    build: ./spas-sidecar
    container_name: order-service-sidecar
    environment:
      - PORT=7001
      - CONFIG_PATH=/app/config.order-service.json
      - SERVICE_NAME=order-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=5001
    volumes:
      - ./spas-sidecar/config.order-service.json:/app/config.order-service.json
    depends_on:
      - redis
      - zipkin
    networks:
      - spas-network

  # Fulfillment Service
  fulfillment-service:
    build: ./fulfillment-service
    container_name: spas-fulfillment-service
    ports:
      - "5002:5002"
    environment:
      - SERVICE_NAME=fulfillment-service
      - SIDECAR_PORT=7002
      - PORT=5002
    networks:
      - spas-network

  # Fulfillment Service SPAS Sidecar
  fulfillment-service-sidecar:
    build: ./spas-sidecar
    container_name: fulfillment-service-sidecar
    environment:
      - PORT=7002
      - CONFIG_PATH=/app/config.fulfillment-service.json
      - SERVICE_NAME=fulfillment-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=5002
    volumes:
      - ./spas-sidecar/config.fulfillment-service.json:/app/config.fulfillment-service.json
    depends_on:
      - redis
      - zipkin
    networks:
      - spas-network

networks:
  spas-network:
    driver: bridge
