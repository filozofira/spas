      - PORT=5002
      - ZIPKIN_URL=http://zipkin:9411
    networks:
      - spas-network
  order-service-sidecar:
    build: ./spas-sidecar
    container_name: order-service-sidecar
    environment:
      - PORT=7002
      - CONFIG_PATH=/app/config.json
      - SERVICE_NAME=order-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=5002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config.order-service.json:/app/config.json
