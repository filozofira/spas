    ports:
      - "9411:9411"
    networks:
      - spas-network
  inventory-service:
    build: ./inventory-service
    container_name: spas-inventory-service
    ports:
      - "5001:5001"
    environment:
      - SERVICE_NAME=inventory-service
      - SIDECAR_PORT=7001
      - PORT=5001
      - ZIPKIN_URL=http://zipkin:9411
    networks:
      - spas-network
  inventory-service-sidecar:
    build: ./spas-sidecar
    container_name: inventory-service-sidecar
    environment:
      - PORT=7001
      - CONFIG_PATH=/app/config.json
      - SERVICE_NAME=inventory-service
      - ZIPKIN_URL=http://zipkin:9411
      - SERVICE_PORT=5001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config.inventory-service.json:/app/config.json
      - ./transformations/inventory-service:/app/transformations
    networks:
      - spas-network
    depends_on:
      - redis
      - zipkin
  order-service:
    build: ./order-service
    container_name: spas-order-service
    ports:
