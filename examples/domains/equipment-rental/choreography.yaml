# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: equipment-rental

# Named choreography flows
flows:
  equipment-rental-fulfillment:
    description: "Equipment rental lifecycle with inventory reservation and fulfillment"
    participants:
      - rental-service
      - inventory-service
      - fulfillment-service
    events:
      # Rental request triggers inventory reservation
      - source: rental-service
        event: rental-requested
        topic: rental-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-rental-requested.jsonata
          - service: fulfillment-service
            command: create-shipment
            transform: transformations/fulfillment-service/inbound-rental-requested.jsonata
      
      # Inventory item added - terminal event (initialization/setup)
      - source: inventory-service
        event: inventory-item-added
        topic: inventory-events
        targets: []
      
      # Stock reservation success - terminal event (fulfillment already initiated)
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets: []
      
      # Stock depleted - terminal event (no consumers in this choreography)
      - source: inventory-service
        event: stock-depleted
        topic: inventory-events
        targets: []
      
      # Shipment created - terminal event
      - source: fulfillment-service
        event: shipment-created
        topic: fulfillment-events
        targets: []
      
      # Shipment status changed - terminal event (tracking updates)
      - source: fulfillment-service
        event: shipment-status-changed
        topic: fulfillment-events
        targets: []
      
      # Equipment returned triggers stock release
      - source: rental-service
        event: rental-returned
        topic: rental-events
        targets:
          - service: inventory-service
            command: release-stock
            transform: transformations/inventory-service/inbound-rental-returned.jsonata
      
      # Stock released - terminal event
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
