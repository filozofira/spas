version: '3.8'

services:
  # SPAS Services (.NET)
  order-service:
    build:
      context: ../../
      dockerfile: examples/services/order-service/Dockerfile
    image: spas-examples/order-service:1.0.0
    container_name: order-service
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - spas-network

  inventory-service:
    build:
      context: ../../
      dockerfile: examples/services/inventory-service/Dockerfile
    image: spas-examples/inventory-service:1.0.0
    container_name: inventory-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - spas-network

  product-service:
    build:
      context: ../../
      dockerfile: examples/services/product-service/Dockerfile
    image: spas-examples/product-service:1.0.0
    container_name: product-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - spas-network

  subscription-service:
    build:
      context: ../../
      dockerfile: examples/services/subscription-service/Dockerfile
    image: spas-examples/subscription-service:1.0.0
    container_name: subscription-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - spas-network

  # Fulfillment Service (Java)
  fulfillment-service:
    build:
      context: ../../
      dockerfile: examples/services/fulfillment-service/Dockerfile
    image: spas-examples/fulfillment-service:1.0.0
    container_name: fulfillment-service
    ports:
      - "5004:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - SERVICE_NAME=fulfillment-service
      - SIDECAR_URL=http://sidecar:8081
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - spas-network

networks:
  spas-network:
    driver: bridge
