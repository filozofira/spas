# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: equipment-rental

# Named choreography flows
flows:
  rental-fulfillment:
    description: "Process equipment rental with parallel inventory reservation and shipment creation"
    participants:
      - rental-service
      - inventory-service
      - fulfillment-service
    events:
      - source: rental-service
        event: rental-requested
        topic: rental-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-rental-requested.jsonata
          - service: fulfillment-service
            command: create-shipment
            transform: transformations/fulfillment-service/inbound-rental-requested.jsonata
      # Terminal events (no downstream consumers)
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets: []
      - source: fulfillment-service
        event: shipment-created
        topic: fulfillment-events
        targets: []

  rental-return:
    description: "Process equipment returns and release inventory reservations"
    participants:
      - rental-service
      - inventory-service
    events:
      - source: rental-service
        event: rental-returned
        topic: rental-events
        targets:
          - service: inventory-service
            command: release-stock
            transform: transformations/inventory-service/inbound-rental-returned.jsonata
      # Terminal event
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []

  catalog-sync:
    description: "Synchronize product catalog additions with inventory tracking"
    participants:
      - product-service
      - inventory-service
    events:
      - source: product-service
        event: product-added
        topic: product-events
        targets:
          - service: inventory-service
            command: add-inventory-item
            transform: transformations/inventory-service/inbound-product-added.jsonata
      # Terminal event
      - source: inventory-service
        event: inventory-item-added
        topic: inventory-events
        targets: []

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
