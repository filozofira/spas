# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: equipment-rental

# Named choreography flows
# Use /spas.compose agent to generate flows based on service contracts
flows:
  equipment-rental-lifecycle:
    description: "Rental lifecycle from request to shipment via inventory"
    participants:
      - rental-service
      - inventory-service
      - fulfillment-service
    events:
      - source: rental-service
        event: rental-requested
        topic: rental-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-rental-requested.jsonata
      - source: rental-service
        event: rental-returned
        topic: rental-events
        targets:
          - service: inventory-service
            command: release-stock
            transform: transformations/inventory-service/inbound-rental-returned.jsonata
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets:
          - service: fulfillment-service
            command: create-shipment
            transform: transformations/fulfillment-service/inbound-stock-reserved.jsonata
      - source: inventory-service
        event: stock-depleted
        topic: inventory-events
        targets: []
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []
      - source: fulfillment-service
        event: shipment-created
        topic: fulfillment-events
        targets: []
      - source: fulfillment-service
        event: shipment-status-changed
        topic: fulfillment-events
        targets: []

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
