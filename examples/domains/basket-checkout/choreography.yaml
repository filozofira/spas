# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: basket-checkout

# Named choreography flows
flows:
  # Flow 1: Basket Management - Terminal events for audit/analytics
  basket-management:
    description: "Customer manages shopping basket items"
    participants:
      - basket-service
    events:
      - source: basket-service
        event: basket-created
        topic: shopping-events
        targets: []  # terminal - audit
      - source: basket-service
        event: item-added
        topic: shopping-events
        targets: []  # terminal - audit/analytics
      - source: basket-service
        event: item-removed
        topic: shopping-events
        targets: []  # terminal - audit/analytics

  # Flow 2: Order Fulfillment - Complete checkout through shipment creation
  order-fulfillment:
    description: "Complete checkout through shipment creation"
    participants:
      - basket-service
      - order-service
      - inventory-service
      - fulfillment-service
    events:
      - source: basket-service
        event: checkout-initiated
        topic: shopping-events
        targets:
          - service: order-service
            command: create-order
            transform: transformations/order-service/inbound-checkout-initiated.jsonata
      - source: order-service
        event: order-created
        topic: order-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-order-created.jsonata
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets:
          - service: order-service
            command: confirm-order
            transform: transformations/order-service/inbound-stock-reserved.jsonata
      - source: inventory-service
        event: stock-depleted
        topic: inventory-events
        targets:
          - service: basket-service
            command: mark-product-unavailable
            transform: transformations/basket-service/inbound-stock-depleted.jsonata
      - source: order-service
        event: order-confirmed
        topic: order-events
        targets:
          - service: fulfillment-service
            command: create-shipment
            transform: transformations/fulfillment-service/inbound-order-confirmed.jsonata
          - service: basket-service
            command: clear-basket
            transform: transformations/basket-service/inbound-order-confirmed.jsonata
      - source: fulfillment-service
        event: shipment-created
        topic: fulfillment-events
        targets:
          - service: order-service
            command: update-shipment-status
            transform: transformations/order-service/inbound-shipment-created.jsonata

  # Flow 3: Shipment Tracking - Update order status as shipment progresses
  shipment-tracking:
    description: "Update order status as shipment progresses through fulfillment lifecycle"
    participants:
      - fulfillment-service
      - order-service
    events:
      - source: fulfillment-service
        event: shipment-status-changed
        topic: fulfillment-events
        targets:
          - service: order-service
            command: update-shipment-status
            transform: transformations/order-service/inbound-shipment-status-changed.jsonata

  # Flow 4: Order Cancellation - Compensating flow to release inventory
  order-cancellation:
    description: "Release inventory when order cancelled"
    participants:
      - order-service
      - inventory-service
    events:
      - source: order-service
        event: order-cancelled
        topic: order-events
        targets:
          - service: inventory-service
            command: release-stock
            transform: transformations/inventory-service/inbound-order-cancelled.jsonata
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []  # terminal - audit compensation

  # Flow 5: Product Management - Initialize inventory for new catalog products
  product-management:
    description: "Initialize inventory for new catalog products"
    participants:
      - product-service
      - inventory-service
    events:
      - source: product-service
        event: product-added
        topic: product-events
        targets:
          - service: inventory-service
            command: add-inventory-item
            transform: transformations/inventory-service/inbound-product-added.jsonata
      - source: inventory-service
        event: inventory-item-added
        topic: inventory-events
        targets: []  # terminal - audit inventory init

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
