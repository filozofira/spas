# SPAS Choreography Configuration
# See: specs/005-spas-compose-cli/contracts/choreography-schema.yaml

version: "1.0"
domain: subscription-order

# Named choreography flows
# Use /spas.compose agent to generate flows based on service contracts
flows:
  subscription-fulfillment-flow:
    description: "B2B subscription order fulfillment with inventory reservation"
    participants:
      - subscription-service
      - order-service
      - inventory-service
    events:
      - source: subscription-service
        event: subscription-created
        topic: subscription-events
        targets:
          - service: order-service
            command: create-order
            transform: transformations/order-service/inbound-subscription-created.jsonata
      
      - source: order-service
        event: order-created
        topic: order-events
        targets:
          - service: inventory-service
            command: reserve-stock
            transform: transformations/inventory-service/inbound-order-created.jsonata
      
      - source: inventory-service
        event: stock-reserved
        topic: inventory-events
        targets:
          - service: order-service
            command: confirm-order
            transform: transformations/order-service/inbound-stock-reserved.jsonata
      
      - source: order-service
        event: order-confirmed
        topic: order-events
        targets:
          - service: subscription-service
            command: activate-subscription
            transform: transformations/subscription-service/inbound-order-confirmed.jsonata
      
      # Terminal events - published for audit/logging/future extension
      - source: subscription-service
        event: subscription-activated
        topic: subscription-events
        targets: []
      
      - source: inventory-service
        event: stock-depleted
        topic: inventory-events
        targets: []
      
      - source: inventory-service
        event: stock-released
        topic: inventory-events
        targets: []
      
      - source: order-service
        event: order-cancelled
        topic: order-events
        targets: []
      
      - source: inventory-service
        event: inventory-item-added
        topic: inventory-events
        targets: []

# Infrastructure components (optional)
infrastructure:
  redis:
    enabled: true
    # host: redis
    # port: 6379
  zipkin:
    enabled: true
    # url: http://zipkin:9411
